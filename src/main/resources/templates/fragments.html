<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 1. Cabecera con Bootstrap CDN unificado y título dinámico -->
<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- 2. Fragmento del Navbar superior -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/about}">ToDoList</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" th:if="${usuario != null}">
                    <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${usuario.id})}">Tareas</a>
                </li>
                <li class="nav-item" th:if="${usuario != null}">
                    <a class="nav-link" th:href="@{/account}">Cuenta</a>
                </li>
                <li class="nav-item" th:if="${usuario != null}">
                    <a class="nav-link" th:href="@{/logout}" th:text="'Cerrar sesión ' + ${usuario.nombre}">Cerrar sesión</a>
                </li>
                <li class="nav-item" th:if="${usuario == null}">
                    <a class="nav-link" th:href="@{/registro}">Registrarse</a>
                </li>
                <li class="nav-item" th:if="${usuario == null}">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 3. Fragmento de Javascript (Bootstrap Bundle incluye Popper internamente) -->
<div th:fragment="javascript">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
