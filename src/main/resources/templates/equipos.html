<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipos')"></head>

<body>
<!-- Navbar arriba del todo -->
<div th:replace="fragments :: navbar"></div>

<div class="container" style="margin-top: 80px;">
    <h2>Listado de Equipos</h2>

    <!-- Tabla para mostrar los equipos que pasas desde el controlador -->
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Recorremos la lista de equipos -->
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.nombre}">Nombre del equipo</td>
            <td>
                <!-- Enlace al detalle del equipo -->
                <a th:href="@{/equipos/{id}(id=${equipo.id})}" class="btn btn-sm btn-primary">Detalle</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/nuevoEquipo}" class="btn btn-success">Nuevo equipo</a>
</div>

</body>
</html>
