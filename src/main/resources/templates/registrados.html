<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Llamamos a nuestra cabecera con el título -->
<head th:replace="fragments :: head (titulo='Usuarios Registrados')"></head>

<body>

<!-- Incluimos el Navbar superior fijo -->
<div th:replace="fragments :: navbar"></div>

<!-- Contenedor principal con margen superior -->
<div class="container" style="margin-top: 80px;">
    <div class="row mt-3">
        <div class="col">
            <h2>Listado de Usuarios Registrados</h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Identificador (ID)</th>
                    <th>Correo Electrónico</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Recorremos la lista de usuarios -->
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td>
                        <!-- Enlace dinámico a la descripción del usuario -->
                        <a class="btn btn-info btn-sm me-1" th:href="@{/registrados/{id}(id=${usuario.id})}">Ver descripción</a>

                        <!-- NUEVO: Botón dinámico de Bloquear / Desbloquear -->
                        <a class="btn btn-sm"
                           th:classappend="${usuario.bloqueado} ? 'btn-success' : 'btn-warning'"
                           th:href="@{/registrados/{id}/bloquear(id=${usuario.id})}"
                           th:text="${usuario.bloqueado} ? 'Desbloquear' : 'Bloquear'">
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Scripts de Bootstrap -->
<div th:replace="fragments::javascript"></div>

</body>
</html>
